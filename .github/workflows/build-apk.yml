name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

            - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore project folders
        shell: bash
        run: |
          mkdir -p build-project/app/src/main/java/com/tictube
          mkdir -p build-project/app/src/main/res/drawable
          mkdir -p build-project/app/src/main/res/mipmap-xxhdpi

          cp *.kt build-project/app/src/main/java/com/tictube/
          cp AndroidManifest.xml build-project/app/src/main/
          cp ic_notification.xml build-project/app/src/main/res/drawable/
          cp ic_launcher*.png build-project/app/src/main/res/mipmap-xxhdpi/
          cp build.gradle.kts build-project/app/
          cp settings.gradle.kts gradle.properties build-project/

          cat > build-project/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.4.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.23" apply false
          }
          EOF

      - name: Build debug APK
        working-directory: build-project
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: TicTube-APK
          path: build-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
